# Runs the automatic checks on every push: a type check, then geometry, map
# projection, tile naming, radio maths, settings, and the terrain reader
# against small stand-in tiles.
name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
